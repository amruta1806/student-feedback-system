version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-southeast-2"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install -r requirements.txt
      - python -m pip install pytest

  pre_build:
    commands:
      - python -m pytest -q

  build:
    commands:
      - zip lambda.zip lambda_function.py
      - zip summary.zip summary_lambda.py
      - cp feedback.html index.html

  post_build:
    commands:
      - aws lambda update-function-code --function-name FeedbackFunction --zip-file fileb://lambda.zip --region $AWS_DEFAULT_REGION || echo "Skipped FeedbackFunction deploy"
      - aws lambda update-function-code --function-name FeedbackSummaryFunction --zip-file fileb://summary.zip --region $AWS_DEFAULT_REGION || echo "Skipped FeedbackSummaryFunction deploy"

artifacts:
  files:
    - index.html
    - results.html
